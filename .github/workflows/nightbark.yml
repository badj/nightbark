# GENERATED by scripts/gen-ci.mjs from ci/pipeline.mjs — DO NOT EDIT BY HAND.
# Edit the definition and re-run `npm run ci:gen`. `npm run ci:check` fails the build if this
# file and the definition disagree, so a hand edit here will be caught rather than silently lost.
# target: .github/workflows/nightbark.yml

name: 'nightbark'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # required to upload SARIF to Code Scanning

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'Prove every gate can fire, and is specific'
        run: 'node bin/nightbark.mjs selftest'
      - name: 'ADR-0001: no client-identifying content'
        run: 'node bin/nightbark.mjs selfcheck'
      - name: 'The committed CI files still match their definition'
        run: 'node scripts/gen-ci.mjs --check'
      - name: 'Output-format and merge tests'
        run: 'node --test "test/*.test.mjs"'
      - name: 'Audit our own test fixtures (dogfood, and proves audit runs headless)'
        run: 'node bin/nightbark.mjs audit fixtures --sarif nightbark.sarif --fail-on never'
        continue-on-error: true
      - name: 'Annotate findings on the diff (SARIF -> Code Scanning)'
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'nightbark.sarif'
        continue-on-error: true
      - name: 'Keep the SARIF as an artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'nightbark-sarif'
          path: 'nightbark.sarif'
